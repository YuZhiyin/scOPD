defaults:
  - sibling_srpo
  - _self_

# Non-thinking dense-reward sibling routing without dynamic entropy weighting.
# Incorrect rollouts use a qualified exact sibling when one exists; otherwise
# they fall back to GRPO.  The visible reasoning protocol must match the SFT.
actor_rollout_ref:
  actor:
    self_distillation:
      dynamic_entropy_weighting: false
      include_environment_feedback: false
      allow_environment_feedback_fallback_for_sdpo: false
      remove_thinking_from_demonstration: false
      reprompt_template: |-
        {prompt}{solution}

        Correctly solve the original cell-annotation problem in non-thinking
        mode. Use the supplied correct sibling response as privileged context,
        but return only the exact response protocol below with no extra text:
        <reasoning>explicit biological reasoning grounded in marker genes,
        cell context, and the global one-to-one matching constraint</reasoning>
        <answer>cell type 1 | cell type 2 | ...</answer>
      solution_template: |-

        Correct response from another rollout of this exact problem:

        {successful_previous_attempt}
      feedback_template: ""
